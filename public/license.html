<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta name="google" content="notranslate">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/phav.png" />
    <link rel="apple-touch-icon" href="/phav.png" />
    <title>Software License | Identity Prism</title>
    <meta name="description" content="Software license terms for Identity Prism." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://identityprism.xyz/license.html" />
    <meta property="og:title" content="Software License | Identity Prism" />
    <meta property="og:description" content="Software license terms for Identity Prism." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://identityprism.xyz/license.html" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Software license terms for Identity Prism." />
    <meta name="twitter:image" content="https://identityprism.xyz/textures/back.png" />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0;
        line-height: 1.6;
        color: #0f172a;
        background: #f8fafc;
      }
      .legal-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 40px;
        background: #ffffff;
        border-bottom: 1px solid rgba(148, 163, 184, 0.35);
        position: sticky;
        top: 0;
      }
      .legal-back {
        text-decoration: none;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 700;
        color: #0f172a;
      }
      .legal-back:hover {
        color: #0ea5e9;
      }
      .legal-logo {
        width: 28px;
        height: 28px;
      }
      .legal-shell {
        padding: 32px 40px 48px;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 16px;
      }
      p {
        max-width: 1176px;
      }
    </style>
  </head>
  <body>
    <nav class="legal-nav">
      <a class="legal-back" href="/" data-legal-back>Back to app</a>
      <img class="legal-logo" src="/phav.png" alt="Identity Prism" />
    </nav>
    <main class="legal-shell">
      <h1>License</h1>
      <p><strong>Last updated:</strong> 2026-02-03</p>
      <p>
        Identity Prism is provided for personal use. You may not redistribute, resell, or modify the
        application or its assets without permission from the publisher.
      </p>
      <p>
        For licensing inquiries, contact
        <a href="mailto:support@identityprism.xyz">support@identityprism.xyz</a>.
      </p>
    </main>
    <script>
      (function () {
        var back = document.querySelector("[data-legal-back]");
        if (!back) return;
        back.addEventListener("click", function (event) {
          event.preventDefault();
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = "/";
          }
        });
      })();
    </script>
  </body>
</html>
